name: Revisar sitio
on:
  push:
    branches: [main]
  pull_request:
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Enlaces, metadatos, sitemap e índice del buscador
        run: python scripts/revisar.py
