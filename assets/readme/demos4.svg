<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="96" viewBox="0 0 1000 96" role="img" aria-label="Simulador SQL y Mi progreso">
<style>.t{font-family:Segoe UI,Helvetica,Arial,sans-serif}.pu{animation:p 3s ease-in-out infinite}@keyframes p{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}</style>
<defs><linearGradient id="g0" x1="0" x2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient></defs>
<g transform="translate(0 0)"><rect width="495" height="96" rx="18" fill="#14172b"/><rect width="8" height="96" rx="4" fill="url(#g0)"/>
<g class="pu" style="transform-origin:56px 48px;animation-delay:0.0s"><circle cx="56" cy="48" r="30" fill="url(#g0)" opacity=".22"/><text x="56" y="59" font-size="30" text-anchor="middle">🗄️</text></g>
<text class="t" x="104" y="42" font-size="21" font-weight="800" fill="#fff">Simulador SQL</text>
<text class="t" x="104" y="68" font-size="14" fill="#c3c9e8">Arma consultas SELECT y mira la tabla al instante</text></g>
<defs><linearGradient id="g1" x1="0" x2="1"><stop offset="0" stop-color="#f59e0b"/><stop offset="1" stop-color="#fde68a"/></linearGradient></defs>
<g transform="translate(505 0)"><rect width="495" height="96" rx="18" fill="#14172b"/><rect width="8" height="96" rx="4" fill="url(#g1)"/>
<g class="pu" style="transform-origin:56px 48px;animation-delay:0.5s"><circle cx="56" cy="48" r="30" fill="url(#g1)" opacity=".22"/><text x="56" y="59" font-size="30" text-anchor="middle">🏆</text></g>
<text class="t" x="104" y="42" font-size="21" font-weight="800" fill="#fff">Panel Mi progreso</text>
<text class="t" x="104" y="68" font-size="14" fill="#c3c9e8">Nivel, racha, meta semanal, reto del día y logros</text></g>
</svg>