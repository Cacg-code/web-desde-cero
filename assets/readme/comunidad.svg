<rect x="540" y="177" width="320" height="12" rx="6" fill="#1f2440"/><rect class="bar" style="animation-delay:0.4s" x="540" y="177" width="259" height="12" rx="6" fill="url(#gr)"/>
<text x="930" y="189" text-anchor="end" font-size="13" fill="#c7d2fe">760 XP</text></g>
<g><rect class="me" x="374" y="208" width="572" height="34" rx="12" fill="#312e81" stroke="#818cf8" stroke-opacity=".4"/>
<text x="392" y="231" font-size="13" font-weight="800" fill="#fde047">4</text><text x="418" y="232" font-size="18">🚀</text><text x="450" y="231" font-size="14" font-weight="700" fill="#e0e7ff">Tú</text>
<rect x="540" y="219" width="320" height="12" rx="6" fill="#1f2440"/><rect class="bar" style="animation-delay:0.6000000000000001s" x="540" y="219" width="208" height="12" rx="6" fill="url(#gr)"/>
<text x="930" y="231" text-anchor="end" font-size="13" fill="#c7d2fe">610 XP</text></g></g></svg>
