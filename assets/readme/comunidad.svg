<rect x="540" y="93" width="320" height="12" rx="6" fill="#1f2440"/><rect class="bar" style="animation-delay:0.0s" x="540" y="93" width="320" height="12" rx="6" fill="url(#gr)"/>
<text x="930" y="105" text-anchor="end" font-size="13" fill="#c7d2fe">940 XP</text></g>
<g><rect class="" x="374" y="124" width="572" height="34" rx="12" fill="#161a33" stroke="#818cf8" stroke-opacity=".4"/>
