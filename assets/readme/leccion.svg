<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="190" viewBox="0 0 1000 190" role="img" aria-label="Cada lección: lee, prueba, evalúate, practica y comprueba">
<style>.t{font-family:Segoe UI,Helvetica,Arial,sans-serif;text-anchor:middle}</style><rect width="1000" height="190" rx="20" fill="#14172b"/>
<line x1="100" y1="80" x2="900" y2="80" stroke="#2b3158" stroke-width="6" stroke-linecap="round"/>
<line x1="100" y1="80" x2="900" y2="80" pathLength="1" stroke="#818cf8" stroke-width="6" stroke-linecap="round" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" values="1;0;0;1" keyTimes="0;.6;.95;1" dur="8s" repeatCount="indefinite"/></line>
<circle cx="100" cy="80" r="34" fill="#1f2440" stroke="#6366f1" stroke-width="3"><animate attributeName="fill" values="#1f2440;#1f2440;#4f46e5;#4f46e5;#1f2440" keyTimes="0;0.0;0.010;.95;1" dur="8s" repeatCount="indefinite"/></circle>
<text class="t" x="100" y="91" font-size="30">📖</text><text class="t" x="100" y="148" font-size="17" font-weight="800" fill="#e0e7ff">LEE</text><text class="t" x="100" y="170" font-size="14" fill="#9aa1c4">Apuntes cortos</text>
<circle cx="300" cy="80" r="34" fill="#1f2440" stroke="#6366f1" stroke-width="3"><animate attributeName="fill" values="#1f2440;#1f2440;#4f46e5;#4f46e5;#1f2440" keyTimes="0;0.15;0.160;.95;1" dur="8s" repeatCount="indefinite"/></circle>
<text class="t" x="300" y="91" font-size="30">⚡</text><text class="t" x="300" y="148" font-size="17" font-weight="800" fill="#e0e7ff">PRUEBA</text><text class="t" x="300" y="170" font-size="14" fill="#9aa1c4">Editor en vivo</text>
<circle cx="500" cy="80" r="34" fill="#1f2440" stroke="#6366f1" stroke-width="3"><animate attributeName="fill" values="#1f2440;#1f2440;#4f46e5;#4f46e5;#1f2440" keyTimes="0;0.3;0.310;.95;1" dur="8s" repeatCount="indefinite"/></circle>
<text class="t" x="500" y="91" font-size="30">✅</text><text class="t" x="500" y="148" font-size="17" font-weight="800" fill="#e0e7ff">EVALÚATE</text><text class="t" x="500" y="170" font-size="14" fill="#9aa1c4">Preguntas</text>
<circle cx="700" cy="80" r="34" fill="#1f2440" stroke="#6366f1" stroke-width="3"><animate attributeName="fill" values="#1f2440;#1f2440;#4f46e5;#4f46e5;#1f2440" keyTimes="0;0.45;0.460;.95;1" dur="8s" repeatCount="indefinite"/></circle>
<text class="t" x="700" y="91" font-size="30">🛠️</text><text class="t" x="700" y="148" font-size="17" font-weight="800" fill="#e0e7ff">PRACTICA</text><text class="t" x="700" y="170" font-size="14" fill="#9aa1c4">Ejercicio</text>
<circle cx="900" cy="80" r="34" fill="#1f2440" stroke="#6366f1" stroke-width="3"><animate attributeName="fill" values="#1f2440;#1f2440;#4f46e5;#4f46e5;#1f2440" keyTimes="0;0.6;0.610;.95;1" dur="8s" repeatCount="indefinite"/></circle>
<text class="t" x="900" y="91" font-size="30">🔍</text><text class="t" x="900" y="148" font-size="17" font-weight="800" fill="#e0e7ff">COMPRUEBA</text><text class="t" x="900" y="170" font-size="14" fill="#9aa1c4">Revisión</text>
