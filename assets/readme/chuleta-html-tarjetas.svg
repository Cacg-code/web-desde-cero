<g transform="translate(0 443)"><rect width="490" height="96" rx="14" fill="#14172b"/><rect width="7" height="96" rx="3.5" fill="url(#g)"/>
<text class="t" x="24" y="30" font-size="17" font-weight="700" fill="#fff">♿ Accesibilidad</text>
<text class="m" x="24" y="52" font-size="13" fill="#f97316">alt aria-label role tabindex</text>
<rect x="20" y="62" width="452" height="26" rx="7" fill="#0b0d1a" stroke="#2b3158"/><text class="m" x="30" y="79" font-size="13" fill="#e0e7ff">&lt;button aria-label="Cerrar"&gt;</text></g>
<g transform="translate(510 443)"><rect width="490" height="96" rx="14" fill="#14172b"/><rect width="7" height="96" rx="3.5" fill="url(#g)"/>
<text class="t" x="24" y="30" font-size="17" font-weight="700" fill="#fff">🔍 SEO</text>
<text class="m" x="24" y="52" font-size="13" fill="#f97316">&lt;title&gt; &lt;meta name="description"&gt; og:*</text>
<rect x="20" y="62" width="452" height="26" rx="7" fill="#0b0d1a" stroke="#2b3158"/><text class="m" x="30" y="79" font-size="13" fill="#e0e7ff">&lt;meta name="description" content="…"&gt;</text></g>
