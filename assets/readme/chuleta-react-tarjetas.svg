<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="556" viewBox="0 0 1000 556" role="img" aria-label="Tarjetas de la chuleta de react">
<style>.t{font-family:Segoe UI,Helvetica,Arial,sans-serif}.m{font-family:Consolas,Menlo,monospace}</style>
<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0ea5e9"/><stop offset="1" stop-color="#67e8f9"/></linearGradient></defs>
<g transform="translate(0 3)"><rect width="490" height="96" rx="14" fill="#14172b"/><rect width="7" height="96" rx="3.5" fill="url(#g)"/>
<text class="t" x="24" y="30" font-size="17" font-weight="700" fill="#fff">🧩 Componente</text>
<text class="m" x="24" y="52" font-size="13" fill="#67e8f9">función que devuelve JSX</text>
<rect x="20" y="62" width="452" height="26" rx="7" fill="#0b0d1a" stroke="#2b3158"/><text class="m" x="30" y="79" font-size="12" fill="#e0e7ff">function Hola() { return &lt;h1&gt;Hola&lt;/h1&gt;; }</text></g>
<g transform="translate(510 3)"><rect width="490" height="96" rx="14" fill="#14172b"/><rect width="7" height="96" rx="3.5" fill="url(#g)"/>
<text class="t" x="24" y="30" font-size="17" font-weight="700" fill="#fff">📨 Datos de entrada</text>
<text class="m" x="24" y="52" font-size="13" fill="#67e8f9">props</text>
<rect x="20" y="62" width="452" height="26" rx="7" fill="#0b0d1a" stroke="#2b3158"/><text class="m" x="30" y="79" font-size="13" fill="#e0e7ff">&lt;Tarjeta titulo="Hola" /&gt;</text></g>
<g transform="translate(0 113)"><rect width="490" height="96" rx="14" fill="#14172b"/><rect width="7" height="96" rx="3.5" fill="url(#g)"/>
<text class="t" x="24" y="30" font-size="17" font-weight="700" fill="#fff">🔄 Estado</text>
<text class="m" x="24" y="52" font-size="13" fill="#67e8f9">useState</text>
<rect x="20" y="62" width="452" height="26" rx="7" fill="#0b0d1a" stroke="#2b3158"/><text class="m" x="30" y="79" font-size="13" fill="#e0e7ff">const [n, setN] = useState(0);</text></g>
<g transform="translate(510 113)"><rect width="490" height="96" rx="14" fill="#14172b"/><rect width="7" height="96" rx="3.5" fill="url(#g)"/>
<text class="t" x="24" y="30" font-size="17" font-weight="700" fill="#fff">📋 Listas</text>
<text class="m" x="24" y="52" font-size="13" fill="#67e8f9">map + key</text>
<rect x="20" y="62" width="452" height="26" rx="7" fill="#0b0d1a" stroke="#2b3158"/><text class="m" x="30" y="79" font-size="12" fill="#e0e7ff">items.map(i =&gt; &lt;li key={i.id}&gt;{i.nombre}&lt;/li&gt;)</text></g>
<g transform="translate(0 223)"><rect width="490" height="96" rx="14" fill="#14172b"/><rect width="7" height="96" rx="3.5" fill="url(#g)"/>
<text class="t" x="24" y="30" font-size="17" font-weight="700" fill="#fff">❓ Condicional</text>
<text class="m" x="24" y="52" font-size="13" fill="#67e8f9">&amp;&amp; · ? :</text>
<rect x="20" y="62" width="452" height="26" rx="7" fill="#0b0d1a" stroke="#2b3158"/><text class="m" x="30" y="79" font-size="13" fill="#e0e7ff">{abierto &amp;&amp; &lt;Menu /&gt;}</text></g>
<g transform="translate(510 223)"><rect width="490" height="96" rx="14" fill="#14172b"/><rect width="7" height="96" rx="3.5" fill="url(#g)"/>
<text class="t" x="24" y="30" font-size="17" font-weight="700" fill="#fff">📝 Formulario</text>
<text class="m" x="24" y="52" font-size="13" fill="#67e8f9">value + onChange</text>
<rect x="20" y="62" width="452" height="26" rx="7" fill="#0b0d1a" stroke="#2b3158"/><text class="m" x="30" y="79" font-size="12" fill="#e0e7ff">&lt;input value={t} onChange={e =&gt; setT(e.target.value)} /&gt;</text></g>
<g transform="translate(0 333)"><rect width="490" height="96" rx="14" fill="#14172b"/><rect width="7" height="96" rx="3.5" fill="url(#g)"/>
<text class="t" x="24" y="30" font-size="17" font-weight="700" fill="#fff">⚙️ Efectos</text>
<text class="m" x="24" y="52" font-size="13" fill="#67e8f9">useEffect</text>
<rect x="20" y="62" width="452" height="26" rx="7" fill="#0b0d1a" stroke="#2b3158"/><text class="m" x="30" y="79" font-size="13" fill="#e0e7ff">useEffect(() =&gt; { … }, [dep]);</text></g>
<g transform="translate(510 333)"><rect width="490" height="96" rx="14" fill="#14172b"/><rect width="7" height="96" rx="3.5" fill="url(#g)"/>
<text class="t" x="24" y="30" font-size="17" font-weight="700" fill="#fff">🌍 Compartir datos</text>
<text class="m" x="24" y="52" font-size="13" fill="#67e8f9">createContext · useContext</text>
<rect x="20" y="62" width="452" height="26" rx="7" fill="#0b0d1a" stroke="#2b3158"/><text class="m" x="30" y="79" font-size="13" fill="#e0e7ff">const tema = useContext(Tema);</text></g>
<g transform="translate(0 443)"><rect width="490" height="96" rx="14" fill="#14172b"/><rect width="7" height="96" rx="3.5" fill="url(#g)"/>
<text class="t" x="24" y="30" font-size="17" font-weight="700" fill="#fff">🧠 Más hooks</text>
<text class="m" x="24" y="52" font-size="13" fill="#67e8f9">useRef · useReducer</text>
<rect x="20" y="62" width="452" height="26" rx="7" fill="#0b0d1a" stroke="#2b3158"/><text class="m" x="30" y="79" font-size="13" fill="#e0e7ff">const ref = useRef(null);</text></g>
</svg>