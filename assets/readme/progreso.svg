<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-label="Progreso y recompensas: XP y niveles, rachas con escudos, meta semanal, reto del día, temas y avatares"><style>.t{font-family:Segoe UI,Helvetica,Arial,sans-serif}.fl{animation:fl 6s ease-in-out infinite}@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.pu{transform-box:fill-box;transform-origin:center;animation:pu 2s ease-in-out infinite}@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14172b"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
<linearGradient id="gr" x1="0" x2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#ec4899"/></linearGradient></defs>
<style>.xp{transform-box:fill-box;transform-origin:left;animation:xp 7s ease-in-out infinite}@keyframes xp{0%{transform:scaleX(.08)}60%,88%{transform:scaleX(.72)}100%{transform:scaleX(.08)}}
.fire{transform-box:fill-box;transform-origin:50% 100%;animation:fi 1.2s ease-in-out infinite}@keyframes fi{0%,100%{transform:scale(1,1)}50%{transform:scale(1.1,1.2)}}
.lv{animation:lv 8s infinite}@keyframes lv{0%,100%{opacity:.45}8%,20%{opacity:1}28%{opacity:.45}}
.up{animation:up 7s infinite;opacity:0}@keyframes up{0%,55%{opacity:0;transform:translateY(0)}62%{opacity:1}85%{opacity:0;transform:translateY(-30px)}100%{opacity:0}}
.day{animation:dy 7s infinite}@keyframes dy{0%,100%{fill:#2b3158}}</style>
<rect width="1000" height="400" rx="22" fill="url(#bg)"/>
<!-- XP -->
<g class="t"><rect x="30" y="28" width="610" height="150" rx="18" fill="#0f1224" stroke="#6366f1" stroke-opacity=".5"/>
<text x="54" y="62" font-size="18" font-weight="800" fill="#fff">🏅 XP y niveles</text><text x="590" y="62" text-anchor="end" font-size="14" fill="#a5b4fc">Nivel 5 · Maquetador</text>
<rect x="54" y="82" width="562" height="22" rx="11" fill="#1f2440"/><rect class="xp" x="54" y="82" width="562" height="22" rx="11" fill="url(#gr)"/>
<text class="up" x="330" y="76" font-size="18" font-weight="800" fill="#fde047">+25 XP</text>
<g font-size="10.5" font-weight="700"><g class="lv" style="animation-delay:0s"><rect x="54" y="124" width="64" height="30" rx="15" fill="#312e81" stroke="#818cf8"/><text x="86" y="143" text-anchor="middle" fill="#e0e7ff">Curioso</text></g><g class="lv" style="animation-delay:1s"><rect x="125" y="124" width="64" height="30" rx="15" fill="#312e81" stroke="#818cf8"/><text x="157" y="143" text-anchor="middle" fill="#e0e7ff">Aprendiz</text></g><g class="lv" style="animation-delay:2s"><rect x="196" y="124" width="64" height="30" rx="15" fill="#312e81" stroke="#818cf8"/><text x="228" y="143" text-anchor="middle" fill="#e0e7ff">Explorador</text></g><g class="lv" style="animation-delay:3s"><rect x="267" y="124" width="64" height="30" rx="15" fill="#312e81" stroke="#818cf8"/><text x="299" y="143" text-anchor="middle" fill="#e0e7ff">Constructor</text></g><g class="lv" style="animation-delay:4s"><rect x="338" y="124" width="64" height="30" rx="15" fill="#312e81" stroke="#818cf8"/><text x="370" y="143" text-anchor="middle" fill="#e0e7ff">Maquetador</text></g><g class="lv" style="animation-delay:5s"><rect x="409" y="124" width="64" height="30" rx="15" fill="#312e81" stroke="#818cf8"/><text x="441" y="143" text-anchor="middle" fill="#e0e7ff">Programador</text></g><g class="lv" style="animation-delay:6s"><rect x="480" y="124" width="64" height="30" rx="15" fill="#312e81" stroke="#818cf8"/><text x="512" y="143" text-anchor="middle" fill="#e0e7ff">Experto</text></g><g class="lv" style="animation-delay:7s"><rect x="551" y="124" width="64" height="30" rx="15" fill="#312e81" stroke="#818cf8"/><text x="583" y="143" text-anchor="middle" fill="#e0e7ff">Maestro</text></g></g></g>
<!-- racha -->
<g class="t"><rect x="660" y="28" width="310" height="150" rx="18" fill="#1c1030" stroke="#f97316" stroke-opacity=".6"/>
<text x="684" y="62" font-size="18" font-weight="800" fill="#fff">🔥 Racha</text>
<g transform="translate(190 38) scale(.7)"><g class="fire"><path d="M760 140c-26-8-32-34-14-56 4 12 12 14 12 14-2-18 8-30 18-38 0 16 20 26 20 52 0 20-16 32-36 28z" fill="#f97316"/><path d="M768 140c-12-2-16-14-8-26 4 6 8 6 8 6 0-8 4-12 8-16 2 10 10 14 8 26-2 8-8 12-16 10z" fill="#fde047"/></g></g>
<text x="850" y="112" font-size="44" font-weight="800" fill="#fdba74">12</text><text x="850" y="138" font-size="14" fill="#fed7aa">días seguidos</text>
<g class="pu"><text x="922" y="62" font-size="26">🛡️</text></g></g>
<!-- meta semanal -->
<g class="t"><rect x="30" y="198" width="300" height="170" rx="18" fill="#0f1224" stroke="#22c55e" stroke-opacity=".5"/>
<text x="54" y="232" font-size="18" font-weight="800" fill="#fff">🎯 Meta semanal</text>
<g><circle cx="66" cy="290" r="14" fill="#22c55e"/><text x="66" y="295" text-anchor="middle" font-size="13" font-weight="800" fill="#052e16">✓</text><text x="66" y="324" text-anchor="middle" font-size="11.5" fill="#9aa1c4">L</text><circle cx="104" cy="290" r="14" fill="#22c55e"/><text x="104" y="295" text-anchor="middle" font-size="13" font-weight="800" fill="#052e16">✓</text><text x="104" y="324" text-anchor="middle" font-size="11.5" fill="#9aa1c4">M</text><circle cx="142" cy="290" r="14" fill="#22c55e"/><text x="142" y="295" text-anchor="middle" font-size="13" font-weight="800" fill="#052e16">✓</text><text x="142" y="324" text-anchor="middle" font-size="11.5" fill="#9aa1c4">M</text><circle cx="180" cy="290" r="14" fill="#22c55e"/><text x="180" y="295" text-anchor="middle" font-size="13" font-weight="800" fill="#052e16">✓</text><text x="180" y="324" text-anchor="middle" font-size="11.5" fill="#9aa1c4">J</text><circle cx="218" cy="290" r="14" fill="#22c55e"/><text x="218" y="295" text-anchor="middle" font-size="13" font-weight="800" fill="#052e16">✓</text><text x="218" y="324" text-anchor="middle" font-size="11.5" fill="#9aa1c4">V</text><circle cx="256" cy="290" r="14" fill="#2b3158"/><text x="256" y="295" text-anchor="middle" font-size="13" font-weight="800" fill="#052e16"></text><text x="256" y="324" text-anchor="middle" font-size="11.5" fill="#9aa1c4">S</text><circle cx="294" cy="290" r="14" fill="#2b3158"/><text x="294" y="295" text-anchor="middle" font-size="13" font-weight="800" fill="#052e16"></text><text x="294" y="324" text-anchor="middle" font-size="11.5" fill="#9aa1c4">D</text></g>
<text x="54" y="354" font-size="13" fill="#86efac">5 de 7 días cumplidos</text></g>
<!-- reto -->
<g class="t"><g class="fl"><rect x="350" y="198" width="300" height="170" rx="18" fill="#0f1224" stroke="#eab308" stroke-opacity=".6"/>
<text x="374" y="232" font-size="18" font-weight="800" fill="#fff">🧠 Reto del día</text>
<rect x="374" y="250" width="252" height="44" rx="10" fill="#1f2440"/><text x="388" y="270" font-size="13" fill="#e0e7ff">¿Qué hace <tspan font-family="Consolas,monospace" fill="#fde047">flex-wrap</tspan>?</text><text x="388" y="286" font-size="11.5" fill="#9aa1c4">Elige una opción…</text>
<rect x="374" y="314" width="92" height="30" rx="15" fill="#eab308"/><text x="420" y="334" text-anchor="middle" font-size="14" font-weight="800" fill="#422006">+25 XP</text></g></g>
<!-- temas -->
<g class="t"><rect x="670" y="198" width="300" height="170" rx="18" fill="#0f1224" stroke="#ec4899" stroke-opacity=".5"/>
<text x="694" y="232" font-size="18" font-weight="800" fill="#fff">🎨 Se desbloquean</text>
<g class="fl"><circle cx="720" cy="290" r="22" fill="#6366f1"/><circle cx="780" cy="290" r="22" fill="#ec4899"/><circle cx="840" cy="290" r="22" fill="#22c55e"/><circle cx="900" cy="290" r="22" fill="#2b3158" stroke="#818cf8" stroke-dasharray="4 4"/><text x="900" y="298" text-anchor="middle" font-size="22">🔒</text></g>
<text x="694" y="346" font-size="13" fill="#f9a8d4">Temas y avatares al subir de nivel</text></g>
</svg>
